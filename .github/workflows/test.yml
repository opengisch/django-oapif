name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    # the stock entry keeps the name of the check it has always been
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            compose_file: tests/docker-compose.yml:tests/docker-compose.dev.yml
          # GEOS 3.13 and a Django fork that knows curves, where they can be written
          - name: tests (curves)
            compose_file: tests/docker-compose.yml:tests/docker-compose.dev.yml:tests/docker-compose.curves.yml
          # without the arrow extra, which django-oapif and its tests have to do without
          - name: tests (without arrow)
            compose_file: tests/docker-compose.yml:tests/docker-compose.dev.yml:tests/docker-compose.no-arrow.yml
          # the oldest Django that django-oapif supports, and 6.0: the other entries get the latest release
          - name: tests (Django 5.2)
            compose_file: tests/docker-compose.yml:tests/docker-compose.dev.yml:tests/docker-compose.django.yml
            django: "5.2"
          - name: tests (Django 6.0)
            compose_file: tests/docker-compose.yml:tests/docker-compose.dev.yml:tests/docker-compose.django.yml
            django: "6.0"
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      COMPOSE_FILE: ${{ matrix.compose_file }}
      DJANGO_VERSION: ${{ matrix.django }}

    steps:
    - uses: actions/checkout@v6

    - name: Create env
      run: cp .env.example .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup Compose
      run: |
        docker compose --profile testing_integration up --build -d

        docker compose exec django python manage.py migrate --no-input
        docker compose exec django python manage.py populate_users
        docker compose exec django python manage.py populate_data

    - name: Check that Arrow is missing
      # otherwise a dependency bringing pyarrow back would make this job test the default stack again
      if: ${{ matrix.name == 'tests (without arrow)' }}
      run: docker compose exec django python manage.py shell -c "import sys; from django_oapif.handler import ARROW_AVAILABLE; sys.exit(ARROW_AVAILABLE)"

    - name: Run unit tests
      run: docker compose exec django python manage.py test

    - name: Run integration tests
      run: docker compose run integration_tests

    - name: Failure logs
      if: failure()
      run: docker compose logs
