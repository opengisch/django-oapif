# overrides for local development (mounts the source, enables debug, live-reload, etc.)
# DO NOT USE ON PRODUCTION !!!

services:

  # caddy:
  #   volumes:
  #     - ./tests/docker/caddy:/etc/caddy

  django:
    environment:
      # live-reload, show exceptions in browser, etc.
      DJANGO_DEBUG: "true"
    volumes:
      # mounting the source code for live reloading
      - ..:/usr/src
      # mounting directory to hold unit tests outputs
      - ./unit_tests_outputs/:/unit_tests_outputs
    ports:
      # making django_oapif_tests directly accessible for debugging
      - ${DJANGO_DEV_PORT:?}:8000
      # debugpy
      - ${DEBUGPY_PORT:?}:5678
    command: python3 -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000

  postgres:
    ports:
      - ${HOST_POSTGRES_PORT:?}:5432

  conformance_test:
    image: pdok/ets-ogcapi-features10-docker:latest
    volumes:
      - ./conformance:/build/run
      - ./output:/build/output
    profiles:
      - testing_conformance
    entrypoint: []
    command: ["/bin/sh", "-c", "/build/run/run.sh"]

  integration_tests:
    # headless QGIS, for amd64 and arm64: master, as no release reads the registered URIs of the JSON-FG profiles yet.
    # QGIS_IMAGE replaces it, with qgis/qgis:3.44-noble until QGIS 3 is dropped
    image: ${QGIS_IMAGE:-qgis/qgis-slim:nightly}
    # an X display for the qgis/qgis images, qgis-slim renders offscreen
    command: sh -c 'xvfb-run python3 -m unittest discover'
    tty: true
    volumes:
      - ./integration:/integration
    working_dir: /integration
    profiles:
      - testing_integration
